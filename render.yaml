services:
  - type: web
    name: outplai-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn outplai_web:application --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
